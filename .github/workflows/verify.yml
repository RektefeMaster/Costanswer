name: Verify

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:data
      # Regenerates the uncommitted OEWS snapshot from the committed BLS
      # archives and fails if it does not hash to the promoted manifest.
      - run: npm run verify:oews
      - run: npm run build
