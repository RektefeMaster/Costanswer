name: Verify

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Lint was documented as a release gate and never run in CI, so the gate
      # and the pipeline disagreed: `npm run verify` was red while CI was green.
      - run: npm run lint
      - run: npm test
      - run: npm run verify:data
      # Regenerates the uncommitted OEWS snapshot from the committed BLS
      # archives and fails if it does not hash to the promoted manifest.
      - run: npm run verify:oews
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://costanswer.com
      # The 3.8 MB CMS chunk shipped to browsers for months because nothing
      # measured the bundle. This is what would have caught it on the first PR.
      - run: node scripts/check-bundle-budget.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
