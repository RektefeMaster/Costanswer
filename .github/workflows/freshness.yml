name: Dataset freshness

# User-facing current / update-due / stale uses the runtime clock. This job
# evaluates the same function against today's UTC date so a long-lived deploy
# cannot hide a missed release.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fail if any dataset is stale
        run: npm run verify:freshness
