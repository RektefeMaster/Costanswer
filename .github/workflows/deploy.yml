name: Deploy (Cloudflare Worker, manual)

# Production is deployed by Vercel from `master`. This workflow is the
# Cloudflare Workers path, kept working but no longer triggered by a push:
# two hosts deploying the same commit means two live copies of the site and no
# single answer to "what is serving costanswer.com".
#
# Run it from the Actions tab when you want a Worker build — the config it
# deploys is the one the build emits, `dist/server/wrangler.json`, not the
# source `wrangler.worker.jsonc`.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check Cloudflare token
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set. Skipping deploy. Add the Edit Cloudflare Workers token as a repository secret, then re-run."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.has_token == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: https://costanswer.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d1a5f19dd2081a3862da14682c9d76e0
        run: npm run deploy
